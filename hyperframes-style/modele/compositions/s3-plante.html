  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.08, duration: 2.05, ease: "none" }, 0);
    tl.fromTo("#s3-cam", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 0);
    // « et là… » : la phrase s'écrit avec la voix
    tl.set("#s3-m1", { opacity: 1 }, 0.08);
    tl.set("#s3-m2", { opacity: 1 }, 0.32);
    // « tout plante » : éclair de 2 images, puis mot-choc qui s'écrase
    tl.set("#s3-flash", { opacity: 1 }, 0.56);

    // « trois heures à chercher » : le chronomètre défile
    tl.set("#s3-serif", { opacity: 0 }, 1.28);
    tl.fromTo("#s3-chrono", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out" }, 1.28);
