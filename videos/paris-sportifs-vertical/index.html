<!doctype html>
<html
  lang="fr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"titre","type":"string","label":"Titre-promesse (au-dessus du film)","default":"Pourquoi tu ne gagnes jamais aux paris sportifs","maxLength":90}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Version TikTok / Shorts / Reels du style « Projecteur » (frame.md, format B) :
         fond noir, titre blanc au-dessus, film 16:9 dans un bandeau 1080×608 centré. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0B1220;
      }
      #fond {
        position: absolute;
        inset: 0;
        background: #0B1220;
      }
      /* Le bas du titre reste fixe à 581 px : un titre plus long monte, il ne descend jamais sur le film. */
      #titre {
        position: absolute;
        left: 125px;
        width: 830px;
        bottom: 1339px;
        color: #fff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 70px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-align: center;
        text-wrap: balance;
      }
      #bandeau {
        position: absolute;
        left: 0;
        top: 656px;
        width: 1080px;
        height: 608px;
        overflow: hidden;
      }
      /* check : début */
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      #ck-barre {
        position: absolute;
        left: 26px;
        top: 1318px;
        width: 1028px;
      }
      #ck-tete {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.15em;
        color: #38bdf8;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 18px;
      }
      #ck-cases {
        display: flex;
        gap: 12px;
      }
      .ck-case {
        position: relative;
        width: 335px;
        height: 150px;
        border: 4px solid #3a4462;
        background: repeating-linear-gradient(-45deg, #13203A 0 14px, #0b1220 14px 28px);
        color: #ecece8;
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        box-sizing: border-box;
      }
      .ck-case b {
        position: absolute;
        left: 12px;
        top: 6px;
        font-weight: 400;
        font-size: 40px;
        line-height: 1;
      }
      .ck-q {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        text-align: center;
        font-size: 96px;
        line-height: 1;
        color: #38bdf8;
      }
      .ck-nom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        font-size: 30px;
        line-height: 1;
        white-space: nowrap;
      }
      .ck-c {
        position: absolute;
        right: 8px;
        top: 8px;
      }
      .ck-v {
        position: absolute;
        right: 8px;
        top: 8px;
        opacity: 0;
      }
      /* check : fin */
      #film {
        width: 1080px;
        height: 608px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56.4"
      data-width="1080"
      data-height="1920"
    >
      <div id="fond" class="clip" data-start="0" data-duration="56.4" data-track-index="0"></div>
      <h1 id="titre" class="clip" data-start="0" data-duration="56.4" data-track-index="1" data-var-text="titre">
        Pourquoi tu ne gagnes jamais aux paris sportifs
      </h1>
      <div id="bandeau">
        <video
          id="film"
          src="assets/paris-sportifs-16x9.mp4"
          data-start="0"
          data-duration="56.4"
          data-track-index="2"
          data-has-audio="true"
        ></video>
      </div>
      <!-- check : début -->
      <div id="ck-barre" class="clip" data-start="0" data-duration="56.4" data-track-index="3" style="opacity: 0">
        <div id="ck-tete">Le piège des paris en 3 mots</div>
        <div id="ck-cases">
          <div id="ck-0" class="ck-case"><b>1</b><span id="ck-q0" class="ck-q">?</span><span id="ck-n0" class="ck-nom" style="opacity: 0">Cote juste</span><i id="ck-c0" class="ck-c"><svg class="ck-cad" viewBox="0 0 120 150" width="34" height="42"><path d="M30 70 L30 42 Q30 12 60 12 Q90 12 90 42 L90 70" fill="none" stroke="#ECECE8" stroke-width="14" stroke-linecap="round" /><rect x="14" y="66" width="92" height="76" rx="14" fill="#38BDF8" /></svg></i><i id="ck-v0" class="ck-v"><svg viewBox="0 0 40 40" width="34" height="34"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#0B1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></i></div>
          <div id="ck-1" class="ck-case"><b>2</b><span id="ck-q1" class="ck-q">?</span><span id="ck-n1" class="ck-nom" style="opacity: 0">Marge</span><i id="ck-c1" class="ck-c"><svg class="ck-cad" viewBox="0 0 120 150" width="34" height="42"><path d="M30 70 L30 42 Q30 12 60 12 Q90 12 90 42 L90 70" fill="none" stroke="#ECECE8" stroke-width="14" stroke-linecap="round" /><rect x="14" y="66" width="92" height="76" rx="14" fill="#38BDF8" /></svg></i><i id="ck-v1" class="ck-v"><svg viewBox="0 0 40 40" width="34" height="34"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#0B1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></i></div>
          <div id="ck-2" class="ck-case"><b>3</b><span id="ck-q2" class="ck-q">?</span><span id="ck-n2" class="ck-nom" style="opacity: 0">Long terme</span><i id="ck-c2" class="ck-c"><svg class="ck-cad" viewBox="0 0 120 150" width="34" height="42"><path d="M30 70 L30 42 Q30 12 60 12 Q90 12 90 42 L90 70" fill="none" stroke="#ECECE8" stroke-width="14" stroke-linecap="round" /><rect x="14" y="66" width="92" height="76" rx="14" fill="#38BDF8" /></svg></i><i id="ck-v2" class="ck-v"><svg viewBox="0 0 40 40" width="34" height="34"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#0B1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></i></div>
        </div>
      </div>
      <!-- check : fin -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // check : début
      tl.to("#ck-0", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: -4, duration: 0.05 }, { x: 0, duration: 0.05 }] }, 17.18);
      tl.to("#ck-0", { rotationY: 360, transformPerspective: 3000, duration: 0.4, ease: "power3.inOut" }, 18.03);
      tl.set("#ck-q0", { opacity: 0 }, 18.23);
      tl.set("#ck-c0", { opacity: 0 }, 18.23);
      tl.set("#ck-n0", { opacity: 1 }, 18.23);
      tl.set("#ck-0", { backgroundImage: "none" }, 18.23);
      tl.to("#ck-0", { borderColor: "#38BDF8", backgroundColor: "rgba(56, 189, 248, 0.3)", scale: 1.08, duration: 0.18 }, 18.23);
      tl.to("#ck-0", { borderColor: "#38BDF8", backgroundColor: "#38BDF8", color: "#0B1220", scale: 1, duration: 0.16 }, 18.51);
      tl.fromTo("#ck-v0", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, 18.51);
      tl.to("#ck-1", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: -4, duration: 0.05 }, { x: 0, duration: 0.05 }] }, 20.06);
      tl.to("#ck-1", { rotationY: 360, transformPerspective: 3000, duration: 0.4, ease: "power3.inOut" }, 20.91);
      tl.set("#ck-q1", { opacity: 0 }, 21.11);
      tl.set("#ck-c1", { opacity: 0 }, 21.11);
      tl.set("#ck-n1", { opacity: 1 }, 21.11);
      tl.set("#ck-1", { backgroundImage: "none" }, 21.11);
      tl.to("#ck-1", { borderColor: "#38BDF8", backgroundColor: "rgba(56, 189, 248, 0.3)", scale: 1.08, duration: 0.18 }, 21.11);
      tl.to("#ck-1", { borderColor: "#38BDF8", backgroundColor: "#38BDF8", color: "#0B1220", scale: 1, duration: 0.16 }, 42.35);
      tl.fromTo("#ck-v1", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, 42.35);
      tl.to("#ck-2", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: -4, duration: 0.05 }, { x: 0, duration: 0.05 }] }, 42.22);
      tl.to("#ck-2", { rotationY: 360, transformPerspective: 3000, duration: 0.4, ease: "power3.inOut" }, 43.07);
      tl.set("#ck-q2", { opacity: 0 }, 43.27);
      tl.set("#ck-c2", { opacity: 0 }, 43.27);
      tl.set("#ck-n2", { opacity: 1 }, 43.27);
      tl.set("#ck-2", { backgroundImage: "none" }, 43.27);
      tl.to("#ck-2", { borderColor: "#38BDF8", backgroundColor: "rgba(56, 189, 248, 0.3)", scale: 1.08, duration: 0.18 }, 43.27);
      tl.to("#ck-2", { borderColor: "#38BDF8", backgroundColor: "#38BDF8", color: "#0B1220", scale: 1, duration: 0.16 }, 45.55);
      tl.fromTo("#ck-v2", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.in", immediateRender: false }, 45.55);
      tl.fromTo("#ck-barre", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 3.52);
      tl.fromTo(".ck-case", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.2, immediateRender: false }, 3.52);
      // check : fin
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
