<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Lefinancier, format vertical natif 1080×1920 : bleu ciel #38BDF8 sur bleu nuit #0B1220 (écrit dans index.html par tools/construire-scenes.py). */
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter Lf"; src: url("assets/fonts/Inter-ExtraBold.otf") format("opentype"); font-weight: 800; }
      @font-face { font-family: "Inter Lf"; src: url("assets/fonts/Inter-Bold.otf") format("opentype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B1220; }
      #fond { position: absolute; inset: 0; background: #0B1220; }

      /* ---- titre en haut (toute la vidéo) ---- */
      #titre { position: absolute; left: 0; top: 0; width: 1080px; height: 330px; z-index: 40; display: flex; align-items: flex-start; justify-content: center;
        padding-top: 150px; background: linear-gradient(180deg, rgba(5, 10, 20, 0.92) 0%, rgba(5, 10, 20, 0.75) 60%, rgba(5, 10, 20, 0) 100%); pointer-events: none; }
      #titre b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 76px; line-height: 1; color: #fff; text-transform: uppercase; letter-spacing: 0.5px;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.7); }

      /* ---- scène et caméra ---- */
      .sc { position: absolute; inset: 0; overflow: hidden; background: #0B1220; }
      .sc-cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
      .sc-cadre { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }

      /* ---- décors ---- */
      .decor { position: absolute; width: 1080px; height: 1920px; overflow: hidden; }
      .ciel { position: absolute; inset: 0; }
      .imm { position: absolute; border-radius: 6px 6px 0 0; background-image: repeating-linear-gradient(90deg, transparent 0 26px, rgba(253, 224, 140, 0.55) 26px 50px, transparent 50px 76px),
        repeating-linear-gradient(180deg, transparent 0 34px, rgba(11, 18, 32, 0.95) 34px 70px); background-blend-mode: normal; box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.25); }
      .lune { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff7d6, #e9dca8); box-shadow: 0 0 80px rgba(255, 247, 214, 0.45); }
      .soleil { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fff6c2, #fcd34d); box-shadow: 0 0 120px rgba(252, 211, 77, 0.7); }
      .trottoir { position: absolute; left: 0; width: 100%; height: 120px; background: linear-gradient(180deg, #1e3358, #172a4b); border-top: 6px solid #2c4675; }
      .sol { position: absolute; left: 0; width: 100%; height: 700px; background: linear-gradient(180deg, #0f1d36 0%, #08101f 100%); border-top: 8px solid #2c4675; }
      .lampe { position: absolute; width: 16px; height: 520px; background: #22385f; border-radius: 8px; }
      .lampe::before { content: ""; position: absolute; left: -46px; top: -6px; width: 70px; height: 22px; border-radius: 12px; background: #fde68a; box-shadow: 0 0 90px 30px rgba(253, 230, 138, 0.35); }
      .mur { position: absolute; inset: 0; background: linear-gradient(180deg, #102445 0%, #0d1d38 70%, #0b1830 100%); }
      .fenetre { position: absolute; width: 330px; height: 300px; border: 14px solid #2c4675; border-radius: 10px; background: linear-gradient(180deg, #050a14, #0f2347); overflow: hidden; }
      .fenetre::after { content: ""; position: absolute; left: 50%; top: 0; width: 12px; height: 100%; margin-left: -6px; background: #2c4675; }
      .plinthe { position: absolute; left: 0; width: 100%; height: 20px; background: #2c4675; }
      .parquet { position: absolute; left: 0; width: 100%; height: 700px; background: repeating-linear-gradient(90deg, #13233f 0 140px, #10203a 140px 280px); }
      .horloge { position: absolute; width: 130px; height: 130px; border-radius: 50%; background: #f1f5f9; border: 10px solid #2c4675; }
      .aig { position: absolute; left: 50%; bottom: 50%; width: 8px; margin-left: -4px; background: #0B1220; border-radius: 4px; transform-origin: 50% 100%; }
      .aig.h { height: 34px; } .aig.m { height: 50px; width: 6px; margin-left: -3px; }
      .enseigne { position: absolute; font-family: "Anton", sans-serif; font-size: 60px; color: #0B1220; background: #F2B705; padding: 6px 26px 4px; border-radius: 10px; border: 6px solid #0B1220; }

      /* ---- personnages ---- */
      .perso { position: absolute; overflow: visible; }
      .perso .c * { fill: #0B1220; stroke: #0B1220; stroke-width: 11; stroke-linejoin: round; }
      .perso .p * { fill: var(--pc); }
      .avatar { position: absolute; width: 170px; height: 300px; }
      .avatar b { position: absolute; left: -10px; top: 250px; font-family: "Anton", sans-serif; font-weight: 400; font-size: 64px; color: #0B1220; background: #38BDF8; padding: 2px 22px 0; border-radius: 12px; }
      .nom { position: absolute; width: 0; height: 0; }
      .nom b { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: "Anton", sans-serif; font-weight: 400; font-size: 48px; color: #0B1220;
        padding: 6px 22px 2px; border-radius: 12px; border: 5px solid #0B1220; }
      .goutte { position: absolute; width: 18px; height: 26px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #bae6fd; border: 3px solid #0B1220; }

      /* ---- vidéos dans la scène ---- */
      .plein { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .vplein { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .vplein video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .voile-bas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: linear-gradient(180deg, rgba(5, 10, 20, 0.2) 0%, rgba(5, 10, 20, 0.15) 50%, rgba(5, 10, 20, 0.7) 100%); }
      .ecran { position: absolute; }
      .ecran-in { position: absolute; inset: 0; overflow: hidden; background: #000; border-radius: 14px; }
      .ecran-tele { border: 14px solid #1f2b44; border-radius: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); background: #1f2b44; }
      .ecran-panneau { border: 12px solid #F1F5F9; border-radius: 22px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); background: #F1F5F9; }
      .tele-pied { position: absolute; left: 50%; bottom: -46px; width: 120px; height: 30px; margin-left: -60px; background: #1f2b44; border-radius: 0 0 14px 14px; }
      .ecran-titre { position: absolute; left: 20px; top: -34px; font-family: "Anton", sans-serif; font-weight: 400; font-size: 40px; color: #0B1220; background: #38BDF8; padding: 2px 16px; border-radius: 8px; }
      .pensee-video { position: absolute; border-radius: 50%; overflow: hidden; border: 14px solid #F1F5F9; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); background: #000; }
      .rond { position: absolute; border-radius: 50%; background: #F1F5F9; }

      /* ---- textes ---- */
      .gros { position: absolute; font-family: "Anton", sans-serif; font-weight: 400; line-height: 1.02; text-transform: uppercase; white-space: nowrap;
        -webkit-text-stroke: 12px #0B1220; paint-order: stroke fill; }
      .gros.bande { background: #38BDF8; padding: 10px 30px 4px; -webkit-text-stroke: 0; border: 6px solid #0B1220; }
      .gros.bande-c { background: #7DD3FC; padding: 10px 0 4px; -webkit-text-stroke: 0; }
      .gros.bande-n { background: #13203A; padding: 14px 0 8px; -webkit-text-stroke: 0; border-top: 6px solid #F2B705; border-bottom: 6px solid #F2B705; }
      .etiq { position: absolute; font-family: "Anton", sans-serif; padding: 8px 26px 4px; border-radius: 10px; border: 5px solid #0B1220; white-space: nowrap; text-transform: uppercase; }
      .tampon { position: absolute; z-index: 6; font-family: "Anton", sans-serif; padding: 4px 26px 0; border: 10px solid; border-radius: 16px; background: rgba(11, 18, 32, 0.85); }
      .calendrier { position: absolute; width: 500px; height: 520px; background: #F1F5F9; border-radius: 30px; border: 10px solid #0B1220; overflow: hidden; text-align: center; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7); }
      .calendrier span { display: block; height: 130px; background: #38BDF8; border-bottom: 10px solid #0B1220; font-family: "Anton", sans-serif; font-size: 90px; line-height: 130px; color: #0B1220; }
      .calendrier b { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 300px; line-height: 360px; color: #0B1220; }
      .calendrier.petit { width: 260px; height: 270px; border-width: 8px; border-radius: 22px; }
      .calendrier.petit span { height: 76px; font-size: 52px; line-height: 76px; border-bottom-width: 8px; }
      .calendrier.petit b { font-size: 150px; line-height: 180px; }

      /* ---- bulles ---- */
      .bulle { position: absolute; background: #F1F5F9; color: #0B1220; font-family: "Inter Lf", sans-serif; font-weight: 800; line-height: 1.15; padding: 26px 34px;
        border-radius: 46px; border: 7px solid #0B1220; white-space: nowrap; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
      .bulle em { font-style: normal; color: #0284C7; }
      .bulle::after { content: ""; position: absolute; bottom: -44px; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 46px solid #0B1220; }
      .bulle::before { content: ""; position: absolute; bottom: -30px; z-index: 1; width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-top: 32px solid #F1F5F9; }
      .bulle.q-g::after { left: 60px; } .bulle.q-g::before { left: 69px; }
      .bulle.q-d::after { right: 60px; } .bulle.q-d::before { right: 69px; }

      /* ---- argent ---- */
      .piece { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe98a, #f2b705 55%, #b07d00); border: 6px solid #0B1220;
        display: flex; align-items: center; justify-content: center; font-family: "Anton", sans-serif; color: #0B1220; }
      .piece span { white-space: nowrap; }
      .billet { position: absolute; width: 230px; height: 112px; border-radius: 10px; border: 5px solid #0B1220; background: linear-gradient(135deg, #7dd3fc, #38bdf8 50%, #0ea5e9);
        font-family: "Anton", sans-serif; color: #0B1220; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
      .billet b { display: block; font-weight: 400; font-size: 48px; line-height: 64px; }
      .billet span { display: block; font-size: 22px; letter-spacing: 2px; }
      .caisse { position: absolute; width: 300px; height: 180px; background: linear-gradient(180deg, #F2B705, #c58f00); border: 8px solid #0B1220; border-radius: 22px 22px 40px 40px;
        text-align: center; font-family: "Anton", sans-serif; color: #0B1220; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6); }
      .caisse b { display: block; font-weight: 400; font-size: 44px; line-height: 70px; border-bottom: 6px solid #0B1220; }
      .caisse i { display: block; font-style: normal; font-size: 62px; line-height: 96px; }
      .compte { position: absolute; padding: 20px 32px 18px; background: #13203A; border: 6px solid #38BDF8; border-radius: 28px; font-family: "Anton", sans-serif; color: #F1F5F9;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); white-space: nowrap; }
      .compte span { display: block; font-size: 34px; color: #7DD3FC; letter-spacing: 1px; }
      .compte b { display: block; font-weight: 400; font-size: 92px; line-height: 1.05; }
      .compte b i { font-style: normal; color: #F2B705; }
      .compte.grand { width: 800px; }
      .compte-ecran { position: relative; width: 736px; height: 300px; margin: 14px 0; border-radius: 16px; overflow: hidden; background: #000; }
      .mois { position: absolute; display: flex; gap: 18px; }
      .mois b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 54px; color: #0B1220; background: #F2B705; padding: 6px 22px 2px; border-radius: 12px; border: 5px solid #0B1220; }
      .ligne-ok { position: absolute; font-family: "Inter Lf", sans-serif; font-weight: 800; font-size: 50px; color: #F1F5F9; background: #13203A; border-left: 12px solid #38BDF8; padding: 16px 26px; border-radius: 12px; white-space: nowrap; }
      .ligne-ok b { color: #F2B705; }
      .ligne-ok i { font-style: normal; display: inline-block; margin-left: 18px; color: #0B1220; background: #38BDF8; border-radius: 50%; width: 64px; height: 64px; text-align: center; line-height: 64px; }
      .banque { position: absolute; width: 230px; height: 230px; background: #F1F5F9; border: 7px solid #0B1220; border-radius: 10px; padding-top: 70px; text-align: center; }
      .banque .toit { position: absolute; left: -24px; top: -70px; width: 0; height: 0; border-left: 132px solid transparent; border-right: 132px solid transparent; border-bottom: 90px solid #0284C7; }
      .banque b { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 46px; color: #0B1220; }
      .banque span { display: inline-block; width: 30px; height: 80px; margin: 8px 12px 0; background: #94A3B8; border: 4px solid #0B1220; }
      .case { position: absolute; width: 170px; height: 160px; background: #13203A; border: 6px solid #2c4675; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .case em { position: absolute; left: 12px; top: 6px; font-family: "Anton", sans-serif; font-style: normal; font-size: 30px; color: #94A3B8; }
      .case b { position: absolute; left: 0; top: 52px; width: 100%; text-align: center; font-family: "Anton", sans-serif; font-weight: 400; font-size: 50px; color: #F2B705; }
      .case.dette { border-color: #FF6B6B; width: 160px; height: 150px; }
      .case.dette b { top: auto; bottom: 6px; font-size: 30px; color: #FF6B6B; }
      .mystere { position: absolute; width: 530px; height: 300px; border-radius: 30px; border: 8px solid #F2B705; background: #13203A; box-shadow: 0 0 80px rgba(242, 183, 5, 0.45); overflow: hidden; }
      .mystere > b { position: absolute; inset: 0; text-align: center; font-family: "Anton", sans-serif; font-weight: 400; font-size: 220px; line-height: 290px; color: #F2B705; }
      .mys-rev { position: absolute; inset: 0; }
      .mys-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(11, 18, 32, 0.45); }
      .mys-txt b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 130px; line-height: 1; color: #F2B705; -webkit-text-stroke: 10px #0B1220; paint-order: stroke fill; }
      .mys-txt span { font-family: "Anton", sans-serif; font-size: 52px; color: #fff; -webkit-text-stroke: 8px #0B1220; paint-order: stroke fill; }
      .mys-txt em { font-family: "Inter Lf", sans-serif; font-weight: 700; font-style: normal; font-size: 30px; color: #F1F5F9; background: rgba(11, 18, 32, 0.8); padding: 2px 14px; border-radius: 8px; margin-top: 6px; }
      .frise { position: absolute; width: 900px; height: 120px; display: flex; align-items: center; gap: 20px; font-family: "Anton", sans-serif; color: #F1F5F9; font-size: 50px; }
      .frise i { flex: 1; height: 14px; background: #38BDF8; border-radius: 7px; }
      .frise b { position: absolute; left: 150px; top: 20px; font-weight: 400; font-size: 70px; color: #F2B705; }
      .sac { position: absolute; width: 300px; height: 260px; border-radius: 40% 40% 30% 30%; background: radial-gradient(circle at 40% 35%, #fde68a, #F2B705 60%, #b07d00); border: 8px solid #0B1220;
        display: flex; align-items: center; justify-content: center; }
      .sac b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 54px; color: #0B1220; }
      .pile { position: absolute; width: 220px; height: 300px; }
      .pile i { position: absolute; left: 0; width: 220px; height: 44px; border-radius: 50%; background: linear-gradient(180deg, #ffe98a, #F2B705 50%, #b07d00); border: 5px solid #0B1220; }
      .pile i:nth-child(1) { bottom: 0; } .pile i:nth-child(2) { bottom: 34px; } .pile i:nth-child(3) { bottom: 68px; }
      .pile i:nth-child(4) { bottom: 102px; } .pile i:nth-child(5) { bottom: 136px; } .pile i:nth-child(6) { bottom: 170px; }

      /* ---- téléphone, messages, appels, notifications ---- */
      .mini-tel { position: absolute; width: 80px; height: 140px; border-radius: 16px; background: #0B1220; border: 6px solid #e2e8f0; box-shadow: inset 0 0 0 6px #38BDF8; }
      .tel { position: absolute; border-radius: 70px; background: #0B1220; border: 14px solid #1f2b44; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.75); overflow: hidden; }
      .tel-cam { position: absolute; left: 50%; top: 18px; width: 120px; height: 30px; margin-left: -60px; border-radius: 16px; background: #000; z-index: 2; }
      .tel-ecran { position: absolute; inset: 0; background: #0f172a; }
      .chat { position: absolute; inset: 0; padding: 70px 28px 20px; display: flex; flex-direction: column; gap: 22px; }
      .chat-tete { display: flex; align-items: center; gap: 18px; padding-bottom: 18px; border-bottom: 3px solid #1e293b; font-family: "Inter Lf", sans-serif; color: #F1F5F9; }
      .chat-tete i { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe98a, #F2B705 60%, #b07d00); border: 4px solid #0B1220; }
      .chat-tete b { display: block; font-weight: 800; font-size: 38px; }
      .chat-tete span { display: block; font-weight: 700; font-size: 28px; color: #94A3B8; }
      .msg { align-self: flex-start; max-width: 440px; background: #1e293b; color: #F1F5F9; font-family: "Inter Lf", sans-serif; font-weight: 700; font-size: 36px; line-height: 1.2;
        padding: 16px 22px; border-radius: 26px 26px 26px 6px; }
      .msg b { display: block; font-weight: 800; font-size: 28px; color: #38BDF8; margin-bottom: 4px; }
      .appel { position: absolute; display: flex; align-items: center; gap: 22px; background: #F1F5F9; border: 6px solid #0B1220; border-radius: 30px; padding: 18px 28px; font-family: "Inter Lf", sans-serif;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6); }
      .appel-ic { width: 80px; height: 80px; border-radius: 50%; background: #38BDF8; border: 5px solid #0B1220; position: relative; }
      .appel-ic::after { content: ""; position: absolute; left: 20px; top: 16px; width: 26px; height: 40px; border: 8px solid #0B1220; border-left: none; border-radius: 0 20px 20px 0; transform: rotate(35deg); }
      .appel b { display: block; font-weight: 800; font-size: 26px; color: #64748b; }
      .appel span { display: block; font-weight: 800; font-size: 40px; color: #0B1220; }
      .notif { position: absolute; width: 900px; background: #F1F5F9; border: 6px solid #0B1220; border-radius: 30px; padding: 22px 30px; font-family: "Inter Lf", sans-serif; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6); }
      .notif b { display: block; font-weight: 800; font-size: 28px; color: #0284C7; }
      .notif span { display: block; font-weight: 800; font-size: 44px; color: #0B1220; }
      .notif em { display: flex; align-items: center; gap: 16px; font-style: normal; font-weight: 800; font-size: 40px; color: #b45309; margin-top: 6px; }
      .spin { display: inline-block; width: 40px; height: 40px; border-radius: 50%; border: 7px solid #fde68a; border-top-color: #b45309; }

      /* ---- bilan et fin ---- */
      .moitie { position: absolute; top: 0; width: 540px; height: 1920px; }
      .sep { position: absolute; left: 532px; top: 330px; width: 16px; height: 1000px; background: #F1F5F9; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8); }
      .tete-col { position: absolute; top: 340px; width: 540px; text-align: center; font-family: "Anton", sans-serif; font-size: 80px; color: #fff; -webkit-text-stroke: 10px #0B1220; paint-order: stroke fill; }
      .profil { position: absolute; width: 800px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px; background: #13203A; border: 6px solid #38BDF8; border-radius: 40px; padding: 34px; box-shadow: 0 40px 110px rgba(0, 0, 0, 0.7); }
      .profil img { width: 200px; height: 200px; border-radius: 50%; border: 6px solid #38BDF8; object-fit: cover; }
      .profil b { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 72px; color: #fff; }
      .profil span { display: block; font-family: "Inter Lf", sans-serif; font-weight: 700; font-size: 30px; color: #94A3B8; }
      .btn { position: absolute; left: 34px; bottom: -40px; width: 732px; text-align: center; font-family: "Anton", sans-serif; font-size: 60px; color: #0B1220; background: #38BDF8; border: 6px solid #0B1220; border-radius: 22px; padding: 8px 0 2px; }
      .btn.ok { background: #F1F5F9; }
      .souris { position: absolute; width: 70px; height: 92px; overflow: visible; }
      .choix { position: absolute; width: 450px; text-align: center; font-family: "Anton", sans-serif; font-size: 84px; color: #0B1220; background: #38BDF8; border: 7px solid #0B1220; border-radius: 26px; padding: 14px 0 6px; }
      .choix.c2 { background: #7DD3FC; }
      .vs { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: #F2B705; border: 7px solid #0B1220; text-align: center; font-family: "Anton", sans-serif; font-size: 62px; line-height: 128px; color: #0B1220; }
      .moto { position: absolute; overflow: visible; }
      .badge-taux { position: absolute; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #ffe98a, #F2B705 55%, #b07d00); border: 12px solid #0B1220;
