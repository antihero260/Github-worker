        --color-light: #ecece8;

      html,

        background: #000;

      /* ---- Composants partagés par toutes les scènes (préfixe pj-) ---- */
      .pj-scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(ellipse 55% 70% at 50% 72%, #262626 0%, var(--color-ground) 72%);
      }
      .pj-cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 60%;
      }
      .pj-horizon {
        position: absolute;
        left: 0;
        width: 100%;
        height: 12px;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.28) 2.5px, transparent 3.5px);
        background-size: 72px 12px;
        opacity: 0.6;
      }
      .pj-cone {
        position: absolute;
        top: -40px;
        width: 560px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.05));

      .pj-sol {
        position: absolute;
        width: 620px;
        height: 150px;
        border-radius: 50%;

      .pj-picto {
        position: absolute;
        overflow: visible;
      }
      .pj-picto .pj-contour * {
        fill: #000;
        stroke: #000;
        stroke-width: 12;
        stroke-linejoin: round;
      }
      .pj-toi .pj-plein * {
        fill: var(--color-accent);
      }
      .pj-elle .pj-plein * {
        fill: var(--color-light);
      }
      .pj-autre .pj-contour * {
        fill: #fff;
        stroke: #fff;
        stroke-width: 9;
      }
      .pj-autre .pj-plein * {
        fill: #050505;
      }
      .pj-label {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        line-height: 1.45;
        white-space: nowrap;

      .pj-label .pj-k {
        color: var(--color-accent);
        display: block;
      }
      .pj-label .pj-d {
        color: var(--hud-grey);
        display: block;
      }
      .pj-equerres {
        position: absolute;
      }
      .pj-equerres i {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: var(--color-accent);
        border-style: solid;
        border-width: 0;

      .pj-equerres i:nth-child(1) {
        left: 0;
        top: 0;
        border-left-width: 6px;
        border-top-width: 6px;
      }
      .pj-equerres i:nth-child(2) {
        right: 0;
        top: 0;
        border-right-width: 6px;
        border-top-width: 6px;

      .pj-equerres i:nth-child(3) {
        left: 0;
        bottom: 0;

        border-bottom-width: 6px;

        border-bottom-width: 6px;

        font-weight: 700;

        line-height: 1.5;

      .pj-msg span {
        opacity: 0;
        padding: 0 3px;
      }
      .pj-x {
        position: absolute;
        pointer-events: none;
      }
      .pj-x::before,
      .pj-x::after {
        content: "";
        position: absolute;
        left: -6%;
        top: 50%;
        width: 112%;
        height: 16px;
        margin-top: -8px;
        background: var(--color-accent);
      }
      .pj-x::before {
        transform: rotate(18deg);
      }
      .pj-x::after {
        transform: rotate(-18deg);

        position: absolute;
