      .pj-scene {

        inset: 0;
        overflow: hidden;
        background: radial-gradient(ellipse 55% 70% at 50% 72%, #262626 0%, var(--color-ground) 72%);

      .pj-cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 60%;

        position: absolute;
        left: 0;
        width: 100%;

        opacity: 0.6;

      .pj-cone {
        position: absolute;
        top: -40px;

      .pj-sol {
        position: absolute;

        border-radius: 50%;

      .pj-picto {
        position: absolute;
        overflow: visible;
      }
      .pj-picto .pj-contour * {
        fill: #000;
        stroke: #000;
        stroke-width: 12;
        stroke-linejoin: round;
      }
      .pj-toi .pj-plein * {
        fill: var(--color-accent);
      }
      .pj-elle .pj-plein * {
        fill: var(--color-light);
      }
      .pj-autre .pj-contour * {
        fill: #fff;
        stroke: #fff;
        stroke-width: 9;

      .pj-autre .pj-plein * {
        fill: #050505;
      }

        font-size: 30px;

        line-height: 1.45;
        white-space: nowrap;

      .pj-label .pj-k {
        color: var(--color-accent);
        display: block;
      }
      .pj-label .pj-d {
        color: var(--hud-grey);
        display: block;
      }
      .pj-equerres {
        position: absolute;
      }
      .pj-equerres i {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: var(--color-accent);
        border-style: solid;
        border-width: 0;
      }
      .pj-equerres i:nth-child(1) {
        left: 0;
        top: 0;
        border-left-width: 6px;
        border-top-width: 6px;
      }
      .pj-equerres i:nth-child(2) {
        right: 0;
        top: 0;
        border-right-width: 6px;
        border-top-width: 6px;
      }
      .pj-equerres i:nth-child(3) {
        left: 0;

        border-bottom-width: 6px;

      .pj-x {
        position: absolute;
        pointer-events: none;
      }
      .pj-x::before,
      .pj-x::after {
        content: "";

        left: -6%;
        top: 50%;
        width: 112%;
        height: 16px;
        margin-top: -8px;
        background: var(--color-accent);

      .pj-x::before {
        transform: rotate(18deg);
      }
      .pj-x::after {
        transform: rotate(-18deg);
