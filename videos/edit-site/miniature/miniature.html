<!doctype html>

    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050507; }
    .fond { position: absolute; inset: -40px; background: url("fond.jpg") center / cover; filter: blur(6px) brightness(0.55) saturate(1.3); }

    .haut .a { font-size: 120px; color: #fff; text-shadow: -7px 0 0 rgba(255, 42, 85, 0.9), 7px 0 0 rgba(0, 229, 255, 0.9), 0 10px 40px rgba(0, 0, 0, 0.8); }

    .ordi .barre i:first-child { background: #dcfc1c; }
    .ordi .barre span { margin-left: 12px; font: 600 21px/1 monospace; color: #9a9a9a; }
    .ordi img { display: block; width: 100%; }
    .tel { position: absolute; right: 60px; top: 860px; width: 300px; height: 600px; border: 12px solid #0c0c0c; border-radius: 50px; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85), 0 0 0 3px #3a3a3a, 0 0 60px rgba(255, 42, 85, 0.4); transform: rotate(7deg); }
    .tel img { width: 100%; }
    .tempo { position: absolute; left: 90px; top: 1290px; padding: 14px 30px 18px; background: #fe2c55; font-family: "Anton", sans-serif; font-size: 78px; line-height: 1; color: #fff; transform: rotate(-5deg); box-shadow: 10px 10px 0 #000; text-transform: uppercase; }
