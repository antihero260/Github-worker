<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Miniature — Ce site ? Un seul prompt</title>
  <style>
    @font-face { font-family: "Anton"; src: url("Anton-Regular.woff2") format("woff2"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0c0c; }
    .fond { position: absolute; inset: -40px; background: url("site-ordi.png") center / cover; filter: blur(26px) brightness(0.35) saturate(1.2); }
    .grain { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 55% at 50% 52%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.65) 100%); }
    .haut { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
    .haut .a { font-size: 150px; color: #ffffff; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
    .haut .b { display: inline-block; margin-top: 18px; padding: 6px 34px 14px; font-size: 148px; color: #0c0c0c; background: #dcfc1c; transform: rotate(-3deg); box-shadow: 14px 14px 0 #000; }
    .ordi { position: absolute; left: 60px; top: 690px; width: 820px; border-radius: 20px; overflow: hidden; background: #15161a; border: 3px solid #2c2c33; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); transform: rotate(-4deg); }
    .ordi .barre { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #0c0c0c; }
    .ordi .barre i { width: 13px; height: 13px; border-radius: 50%; background: #444; }
    .ordi .barre i:first-child { background: #dcfc1c; }
    .ordi .barre span { margin-left: 12px; font: 600 20px/1 monospace; color: #9a9a9a; }
    .ordi img { display: block; width: 100%; }
    .tel { position: absolute; right: 70px; top: 790px; width: 310px; height: 530px; border: 12px solid #0c0c0c; border-radius: 52px; overflow: hidden; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85), 0 0 0 3px #3a3a3a; transform: rotate(6deg); }
    .tel img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .zero { position: absolute; left: 0; right: 0; top: 1350px; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; }
    .zero span { position: relative; display: inline-block; font-size: 120px; color: #ffffff; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.9); }
    .zero span b { font-weight: 400; color: #dcfc1c; }
    .zero span i { position: absolute; left: 22%; right: -2%; top: 52%; height: 16px; border-radius: 8px; background: #ff3b3b; }
    .bas { position: absolute; left: 50%; top: 1560px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 22px 44px; border-radius: 60px; background: #ffffff; font-family: "Anton", sans-serif; font-size: 64px; text-transform: uppercase; color: #0c0c0c; white-space: nowrap; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); }
    .bas em { font-style: normal; color: #fe2c55; }
    .bas svg { width: 54px; height: 54px; }
  </style>
</head>
<body>
  <div class="fond"></div>
  <div class="grain"></div>
  <div class="haut"><div class="a">Ce site =</div><div class="b">1 seul prompt</div></div>
  <div class="ordi"><div class="barre"><i></i><i></i><i></i><span>cafe-aurore.ci</span></div><img src="site-ordi.png" alt="" /></div>
  <div class="tel"><img src="site-tel.png" alt="" /></div>
  <div class="zero"><span><b>0</b> ligne de code<i></i></span></div>
  <div class="bas"><svg viewBox="0 0 40 40"><path d="M6 8 h28 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-16 l-8 7 v-7 h-4 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 4 -4 z" fill="#fe2c55" /></svg>Commente <em>PROMPT</em></div>
</body>
</html>
