<!doctype html>
<html
  lang="fr"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fond","default":"#0B1220"},
    {"id":"color-accent","type":"color","label":"Accent (toi, chiffres clés)","default":"#38BDF8"},
    {"id":"color-light","type":"color","label":"Clair (elle, papiers, serif)","default":"#ECECE8"},
    {"id":"caption-box","type":"color","label":"Bandeau des sous-titres","default":"#EEEEEA"},
    {"id":"caption-ink","type":"color","label":"Texte des sous-titres","default":"#0A0A06"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Style « Projecteur » : film 16:9 (format YouTube), valeurs de ../frame.md. */
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        font-style: italic;
        font-weight: 400;
      }
      :root {
        --color-ground: #0b1220;
        --color-accent: #38bdf8;
        --color-light: #ecece8;
        --caption-box: #eeeeea;
        --caption-ink: #08101E;
        --accent-shade: #98ac18;
        --accent-glow: rgba(56, 189, 248, 0.35);
        --hud-grey: #9a9a9a;
        --caption-y: 915px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #fond {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }

      /* ---- Composants partagés par toutes les scènes (préfixe pj-) ---- */
      .pj-scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(ellipse 55% 70% at 50% 72%, #262626 0%, var(--color-ground) 72%);
      }
      .pj-cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 60%;
      }
      .pj-horizon {
        position: absolute;
        left: 0;
        width: 100%;
        height: 12px;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.28) 2.5px, transparent 3.5px);
        background-size: 72px 12px;
        opacity: 0.6;
      }
      .pj-cone {
        position: absolute;
        top: -40px;
        width: 560px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.05));
        clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
        filter: blur(16px);
      }
      .pj-sol {
        position: absolute;
        width: 620px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 70%);
      }
      .pj-picto {
        position: absolute;
        overflow: visible;
      }
      .pj-picto .pj-contour * {
        fill: #000;
        stroke: #000;
        stroke-width: 12;
        stroke-linejoin: round;
      }
      .pj-toi .pj-plein * {
        fill: var(--color-accent);
      }
      .pj-elle .pj-plein * {
        fill: var(--color-light);
      }
      .pj-autre .pj-contour * {
        fill: #fff;
        stroke: #fff;
        stroke-width: 9;
      }
      .pj-autre .pj-plein * {
        fill: #050505;
      }
      .pj-label {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        line-height: 1.45;
        white-space: nowrap;
      }
      .pj-label .pj-k {
        color: var(--color-accent);
        display: block;
      }
      .pj-label .pj-d {
        color: var(--hud-grey);
        display: block;
      }
      .pj-equerres {
        position: absolute;
      }
      .pj-equerres i {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: var(--color-accent);
        border-style: solid;
        border-width: 0;
      }
      .pj-equerres i:nth-child(1) {
        left: 0;
        top: 0;
        border-left-width: 6px;
        border-top-width: 6px;
      }
      .pj-equerres i:nth-child(2) {
        right: 0;
        top: 0;
        border-right-width: 6px;
        border-top-width: 6px;
      }
      .pj-equerres i:nth-child(3) {
        left: 0;
        bottom: 0;
        border-left-width: 6px;
        border-bottom-width: 6px;
      }
      .pj-equerres i:nth-child(4) {
        right: 0;
        bottom: 0;
        border-right-width: 6px;
        border-bottom-width: 6px;
      }
      .pj-sticker {
        position: absolute;
        background: var(--color-accent);
        color: #000;
        font-family: "Anton", sans-serif;
        font-size: 84px;
        line-height: 1;
        padding: 8px 24px 10px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .pj-papier {
        position: absolute;
        background: var(--color-light);
        color: #08101E;
        padding: 40px 44px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .pj-papier h3 {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 104px;
        line-height: 1;
        text-transform: uppercase;
      }
      .pj-papier .pj-ligne {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.06em;
        margin-top: 22px;
        white-space: nowrap;
      }
      .pj-impact {
        font-family: "Anton", sans-serif;
        color: var(--color-accent);
        text-transform: uppercase;
        line-height: 0.9;
        text-shadow:
          0 0 28px var(--accent-glow),
          0 0 70px var(--accent-glow);
        white-space: nowrap;
      }
      .pj-serif {
        position: absolute;
        font-family: "Instrument Serif", serif;
        font-style: italic;
        color: var(--color-light);
        line-height: 1.1;
      }
      .pj-serif span {
        opacity: 0;
      }
      .pj-stat {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        color: var(--color-accent);
        white-space: nowrap;
      }
      .pj-flash {
        position: absolute;
        inset: 0;
        background: var(--color-accent);
        opacity: 0;
      }

      /* ---- Composants ajoutés pour cette vidéo ---- */
      .pj-cadre {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .pj-perso {
        position: absolute;
        overflow: visible;
      }
      .pj-perso .c * {
        fill: #000;
        stroke: #000;
        stroke-width: 10;
        stroke-linejoin: round;
      }
      .pj-ia-perso .p * {
        fill: var(--color-light);
      }
      .pj-perso .yeux * {
        fill: #08101E;
        stroke: none;
      }
      .pj-toi-perso .p * {
        fill: var(--color-accent);
      }
      .pj-chat {
        position: absolute;
        background: #13203A;
        border: 2px solid #4a4a4a;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
      }
      .pj-chat-tete {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        padding: 0 26px;
        border-bottom: 2px solid #2e2e2e;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.12em;
        color: var(--hud-grey);
        text-transform: uppercase;
      }
      .pj-chat-tete i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #3a3a3a;
      }
      .pj-msg {
        position: absolute;
        background: var(--color-light);
        color: #08101E;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.5;
        padding: 26px 32px;
      }
      .pj-msg span {
        opacity: 0;
        padding: 0 3px;
      }
      .pj-x {
        position: absolute;
        pointer-events: none;
      }
      .pj-x::before,
      .pj-x::after {
        content: "";
        position: absolute;
        left: -6%;
        top: 50%;
        width: 112%;
        height: 16px;
        margin-top: -8px;
        background: var(--color-accent);
      }
      .pj-x::before {
        transform: rotate(18deg);
      }
      .pj-x::after {
        transform: rotate(-18deg);
      }
      .pj-carte {
        position: absolute;
        background: var(--color-light);
        color: #08101E;
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        line-height: 1;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .pj-ligne-coche {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.06em;
        color: var(--color-light);
        white-space: nowrap;
        margin-bottom: 26px;
      }
      .pj-ligne-coche b {
        display: inline-block;
        width: 46px;
        height: 46px;
        border: 4px solid var(--color-light);
        margin-right: 22px;
        vertical-align: -10px;
        text-align: center;
        line-height: 38px;
        font-size: 34px;
        color: #000;
      }
      /* ---- styles générés : début (tools/construire-scenes.py) ---- */
      .pj-cadre > .pj-horizon {
        left: -800px;
        width: 3520px;
      }
      .pj-logo {
        position: absolute;
        background: #13203A;
        border: 3px solid #4a4a4a;
        padding: 34px 0 20px;
        text-align: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
      }
      .pj-logo img {
        display: block;
        margin: 0 auto;
      }
      .pj-logo-nom {
        font-family: "Anton", sans-serif;
        font-size: 44px;
        line-height: 1;
        color: var(--color-light);
        text-transform: uppercase;
        margin-top: 18px;
      }
      .pj-panneau {
        position: absolute;
        background: #000;
        outline: 3px solid var(--color-light);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
      }
      .pj-panneau > video,
      .pj-panneau > img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pj-panneau-tag {
        position: absolute;
        left: 0;
        top: 0;
        background: var(--color-accent);
        color: #000;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 16px;
        white-space: nowrap;
      }
      .pj-tel {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: #0f0f0f;
        border: 8px solid #2c2c2c;
        border-radius: 52px;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.75);
      }
      .pj-tel-tete {
        flex: none;
        height: 74px;
        padding-top: 20px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 28px;
        color: #a3a3a3;
        border-bottom: 2px solid #232323;
      }
      .pj-tel-conv {
        flex: 1;
        position: relative;
      }
      .pj-tel-bulle {
        position: absolute;
        max-width: 280px;
        padding: 12px 18px;
        border-radius: 22px;
        background: var(--color-accent);
        color: #000;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 24px;
        line-height: 1.25;
      }
      .pj-tel-champ {
        flex: none;
        margin: 8px 14px;
        min-height: 64px;
        padding: 14px 18px;
        border-radius: 26px;
        background: #262626;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 25px;
        line-height: 1.3;
        color: var(--color-light);
      }
      .pj-tel-curseur {
        display: inline-block;
        width: 3px;
        height: 28px;
        background: var(--color-accent);
        vertical-align: -5px;
        margin-left: 3px;
      }
      .pj-tel-sugg {
        flex: none;
        display: flex;
        height: 64px;
        background: #1a1a1a;
        border-top: 2px solid #232323;
      }
      .pj-tel-cell {
        flex: 1;
        position: relative;
        border-left: 2px solid #2e2e2e;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: var(--color-light);
      }
      .pj-tel-cell:first-child {
        border-left: none;
      }
      .pj-tel-cell span {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        line-height: 62px;
        text-align: center;
        white-space: nowrap;
      }
      .pj-tel-clavier {
        flex: none;
        height: 270px;
        padding: 14px 6px 0;
        background: #1a1a1a;
      }
      .pj-tel-rang {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 9px;
      }
      .pj-tel-rang i {
        flex: none;
        width: 31px;
        height: 50px;
        border-radius: 7px;
        background: #333333;
        color: var(--color-light);
        font-style: normal;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 20px;
        line-height: 50px;
        text-align: center;
      }
      .pj-tel-rang i.pj-tel-esp {
        width: 200px;
        font-size: 18px;
        color: #a3a3a3;
      }
      .pj-jour {
        width: 76px;
        height: 76px;
        border: 4px solid var(--color-light);
        font-family: "Anton", sans-serif;
        font-size: 40px;
        line-height: 68px;
        text-align: center;
        color: var(--color-light);
      }
      .pj-icone {
        display: inline-block;
        width: 78px;
        height: 78px;
        margin-right: 26px;
        background: var(--color-accent);
        color: #000;
        font-family: "Anton", sans-serif;
        font-size: 58px;
        font-weight: 400;
        line-height: 78px;
        text-align: center;
        vertical-align: -14px;
      }
      .pj-icone svg {
        vertical-align: -6px;
      }
      .pj-mini-papier {
        position: absolute;
        width: 96px;
        height: 124px;
        padding: 12px 12px;
        background: var(--color-light);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .pj-puce {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        background: #1c1c1c;
        border: 4px solid var(--color-accent);
        color: var(--color-light);
        font-family: "Anton", sans-serif;
        font-size: 46px;
        line-height: 1;
        padding: 10px 22px 12px;
        text-transform: uppercase;
      }
      .pj-pensee {
        background: var(--color-light);
        color: #08101E;
        padding: 14px 34px 18px;
        border-radius: 60px;
        white-space: nowrap;
      }
      .pj-bulle-rond {
        position: absolute;
        border-radius: 50%;
        background: var(--color-light);
      }
      .pj-barre {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .pj-barre-mot {
        flex: none;
        width: 250px;
        font-family: "Anton", sans-serif;
        font-size: 58px;
        line-height: 1;
        color: var(--color-light);
        text-transform: uppercase;
      }
      .pj-barre-piste {
        flex: 1;
        position: relative;
        height: 36px;
        background: #2a2a2a;
      }
      .pj-barre-piste i {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: var(--color-accent);
        transform-origin: 0% 50%;
      }
      .pj-barre-pct {
        flex: none;
        width: 140px;
        text-align: right;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 42px;
        color: var(--color-accent);
      }
      .pj-ligne-appris {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 56px;
        line-height: 1.25;
        margin-top: 18px;
        white-space: nowrap;
      }
      .pj-ligne-appris b {
        font-weight: 400;
        padding: 0 6px;
      }
      .pj-barre-sugg {
        position: absolute;
        display: flex;
        height: 64px;
        background: rgba(20, 20, 20, 0.88);
      }
      .pj-barre-sugg span {
        flex: 1;
        text-align: center;
        line-height: 64px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 30px;
        color: var(--color-light);
      }
      .pj-etape {
        position: absolute;
        display: flex;
        align-items: baseline;
        gap: 14px;
        background: var(--color-accent);
        color: #000;
        font-family: "Anton", sans-serif;
        padding: 8px 26px 12px;
        text-transform: uppercase;
        white-space: nowrap;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .pj-etape span {
        font-size: 56px;
      }
      .pj-etape b {
        font-size: 100px;
        font-weight: 400;
        line-height: 0.9;
      }
      .pj-etape i {
        font-style: normal;
        font-size: 46px;
        opacity: 0.6;
      }
      .pj-fenetre {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: #151515;
        border: 2px solid #3a3a3a;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.75);
      }
      .pj-fen-barre {
        flex: none;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        background: #1f1f1f;
        border-bottom: 2px solid #2c2c2c;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        color: #a3a3a3;
        white-space: nowrap;
      }
      .pj-fen-barre i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #3a3a3a;
      }
      .pj-fen-barre img {
        height: 30px;
        margin-left: 14px;
      }
      .pj-fen-corps {
        flex: 1;

      }
      .pj-fen-vide {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 34px;

      .pj-fen-vide2 {

        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 32px;
        color: #a3a3a3;
      }
      .pj-fen-bouton {
        position: absolute;
        left: 328px;

        width: 340px;
        height: 76px;

        background: #ea4b71;
        color: #fff;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 32px;
        line-height: 76px;
        text-align: center;
        white-space: nowrap;
      }
      .pj-fen-carte {
        position: absolute;
        left: 40px;
        top: 120px;
        width: 560px;
        padding: 26px 30px;
        border: 4px solid var(--color-accent);
        border-radius: 16px;
        background: #23260f;
        font-family: "Inter", sans-serif;
        color: var(--color-light);
      }
      .pj-fen-carte b {
        display: block;

      }
      .pj-fen-carte span {

      }
