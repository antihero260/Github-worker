<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Miniature — Ton site crie « fait par l'IA »</title>
  <style>
    @font-face { font-family: "Anton"; src: url("Anton-Regular.woff2") format("woff2"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0c; font-family: "Anton", sans-serif; text-transform: uppercase; }
    .mur { position: absolute; left: -60px; top: 560px; width: 1200px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; transform: rotate(-6deg); }
    .mur img { width: 100%; border-radius: 12px; border: 3px solid #2c2c33; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
    .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 11, 12, 0.95) 0%, rgba(11, 11, 12, 0.2) 34%, rgba(11, 11, 12, 0.2) 66%, rgba(11, 11, 12, 0.96) 82%); }
    .haut { position: absolute; left: 0; right: 0; top: 190px; text-align: center; line-height: 0.95; }
    .haut .a { font-size: 150px; color: #ffffff; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
    .tampon { position: absolute; left: 50%; top: 820px; transform: translateX(-50%) rotate(-8deg); padding: 10px 44px 18px; font-size: 150px; line-height: 1; color: #ffffff; background: #ff4d4d; border: 8px solid #ffffff; white-space: nowrap; box-shadow: 18px 18px 0 #000; }
    .cases { position: absolute; left: 50%; top: 1340px; transform: translateX(-50%); display: flex; gap: 26px; }
    .cases div { width: 190px; height: 220px; border-radius: 22px; display: grid; place-items: center; background: #0d0d10; border: 6px solid #dcfc1c; box-shadow: 0 0 40px rgba(220, 252, 28, 0.6), 0 20px 50px rgba(0, 0, 0, 0.8); font-size: 140px; color: #dcfc1c; }
    .bas { position: absolute; left: 0; right: 0; top: 1630px; text-align: center; font-size: 76px; color: #ffffff; }
    .bas em { font-style: normal; color: #dcfc1c; }
  </style>
</head>
<body>
  <div class="mur"><img src="s0.jpg" alt="" /><img src="s1.jpg" alt="" /><img src="s2.jpg" alt="" /><img src="s3.jpg" alt="" /><img src="s4.jpg" alt="" /><img src="s5.jpg" alt="" /><img src="s6.jpg" alt="" /><img src="s7.jpg" alt="" /><img src="s8.jpg" alt="" /></div>
  <div class="voile"></div>
  <div class="haut"><div class="a">Ton site crie</div></div>
  <div class="tampon">Fait par l’IA</div>
  <div class="cases"><div>?</div><div>?</div><div>?</div></div>
  <div class="bas">Les <em>3 signes</em> qui te trahissent</div>
</body>
</html>
